# Checks every pull request and push to main: vet, the tests, and that the
# generated packages match spec/, so a spec and its code land together.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: The generated packages match spec/
        run: go generate ./... && git diff --exit-code
